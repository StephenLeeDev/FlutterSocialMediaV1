name: flutter_social_media_v1
description: Flutter Social Media Mobile Application

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0

  # Firebase
  firebase_core: ^5.2.0
  firebase_auth: ^7.1.0
  firebase_messaging: ^17.1.0

  # Notification
  flutter_local_notifications: ^23.0.4

  # Social SignIn
  google_sign_in: ^7.2.0

  # Networking
  dio: ^5.1.2
  pretty_dio_logger: ^1.3.1

  # Route
  go_router: ^18.1.4

  # State Management
  provider: ^6.0.5

  # Dependency Injection
  get_it: ^9.3.0

  # Local Storage
  flutter_secure_storage: ^11.2.0

  # Image Slider
  flutter_image_slideshow: ^0.1.5

  # Image Picker
  image_picker: ^1.0.1

  # List
  scrollable_positioned_list: ^0.3.8

  # Geo location
  geolocator: ^14.1.2

  # SharedPreferences
  shared_preferences: ^2.1.2

  # Localizing
  intl: ^0.20.3

  # SVG
  flutter_svg: ^2.5.0

  # Splash
  flutter_native_splash: ^2.2.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  mocktail: ^1.0.5

flutter:
  uses-material-design: true

  assets:
    # Add assets from the images directory to the application.
    - assets/image/
    - assets/icon/

flutter_native_splash:
  color: "#000000"
  image: assets/image/logo_white.png
  fullscreen: true
  ios: true

  android_12:
    image: assets/image/logo_white.png
    icon_background_color: "#000000"
    icon_background_color_dark: "#000000"

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/image/logo_white.png"
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false
  adaptive_icon_foreground: "assets/image/logo_white.png"
  adaptive_icon_background: "#000000"
